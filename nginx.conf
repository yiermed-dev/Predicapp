# nginx.conf

server {
    listen 80;
    server_name localhost;

    root /path/to/your/static/files;  # Adjust this path

    index index.html;

    # Enable Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;  # Handle SPA routing
    }

    location ~* \.(html|css|js|jpg|jpeg|png|gif|ico|svg)$ {
        expires 1y;  # Cache static files for 1 year
        access_log off;  # Optional: Disable access logging for static assets
    }
}